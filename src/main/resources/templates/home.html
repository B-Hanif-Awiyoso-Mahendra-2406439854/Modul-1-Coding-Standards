<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>ADV Shop</title>
  <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
</head>
<body>

<div class="container my-5">
  <h3>Welcome</h3>
  <p class="lead">Welcome to ADV Shop - Your Online E-commerce Platform</p>

  <div class="mt-4">
    <a th:href="@{/product/list}" class="btn btn-primary btn-lg">View Products</a>
    <a th:href="@{/product/create}" class="btn btn-success btn-lg">Create Product</a>
  </div>

  <div class="mt-5">
    <h4>Features</h4>
    <ul class="list-group">
      <li class="list-group-item">Create and manage products</li>
      <li class="list-group-item">View product list</li>
      <li class="list-group-item">Edit product details</li>
      <li class="list-group-item">Delete products</li>
    </ul>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
</body>
</html>
