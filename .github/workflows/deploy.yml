name: Deploy to Koyeb

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Koyeb
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Koyeb CLI
        run: |
          curl -fsSL https://cli.koyeb.com/install.sh | sh
          echo "$HOME/.koyeb/bin" >> $GITHUB_PATH

      - name: Deploy to Koyeb with Docker
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_TOKEN }}
        run: |
          # Try to create new service, or update if exists
          koyeb service create eshop \
            --app eshop \
            --git github.com/${{ github.repository }} \
            --git-branch ${{ github.ref_name }} \
            --git-builder dockerfile \
            --git-dockerfile Dockerfile \
            --ports 8080:http \
            --routes /:8080 \
            --regions fra \
            --instance-type nano \
            --env PORT=8080 \
            --skip-cache || \
          koyeb service update eshop/eshop \
            --git github.com/${{ github.repository }} \
            --git-branch ${{ github.ref_name }} \
            --skip-cache